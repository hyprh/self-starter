name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Tests that run probes skip themselves without Deno; here that would hide them.
      - name: Check the bundled Deno
        run: node --input-type=module -e "import { bundledDeno } from './dist/src/engine/config.js'; if (!bundledDeno()) throw new Error('the deno npm package has no binary');"
      - run: npm test

  # With the real Codex CLI: installs as the README says (launchd or systemd, a
  # trigger, a crash, a reinstall, an uninstall; test/e2e/install.ts), then runs
  # fires through Codex with a stand-in model (test/e2e/agent.ts).
  e2e:
    name: End to end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install -g @openai/codex && codex --version
      - name: Start a systemd user session, and get notify-send
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libnotify-bin
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for _ in $(seq 30); do
            XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user show-environment > /dev/null 2>&1 && exit 0
            sleep 1
          done
          exit 1
      - run: npm link && self-starter version
      - run: node dist/test/e2e/install.js
      - run: node dist/test/e2e/agent.js

  # With the real Claude Code CLI: installs the plugin from this checkout as the
  # README says, and runs fires into an interactive session (in tmux), a closed
  # session and a trigger's own session, with a stand-in model (test/e2e/cc-agent.ts).
  e2e-claude-code:
    name: End to end in Claude Code (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Get tmux
        run: |
          command -v tmux && exit 0
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get update -qq && sudo apt-get install -y -qq tmux; fi
      - run: node dist/test/e2e/cc-agent.js
