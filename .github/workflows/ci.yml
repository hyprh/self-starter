name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Tests that run probes skip themselves without Deno; here that would hide them.
      - name: Check the bundled Deno
        run: node --input-type=module -e "import { bundledDeno } from './dist/src/engine/config.js'; if (!bundledDeno()) throw new Error('the deno npm package has no binary');"
      - run: npm test
