# Publishes the npm package (`self-starter`) and GitHub release when a version tag is pushed,
# with its section of CHANGELOG.md.
# The plugin's launcher installs the prebuilt npm package (`self-starter@<version>`), falling
# back to the release tag (`github:hyprh/self-starter#v<version>`) if needed.
# During development, existing catalogs keep their published runtime version.
# Before tagging, update all plugin manifests to match package.json.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Check the tag against the package and the plugins
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$version"
          test "$(node -p 'require("./codex-plugin/.codex-plugin/plugin.json").version')" = "$version"
          test "$(node -p 'require("./cc-plugin/.claude-plugin/plugin.json").version')" = "$version"
          test "$(node -p 'require("./agy-plugin/plugin.json").version')" = "$version"
          test "$(node -p 'require("./zcode-plugin/.zcode-plugin/plugin.json").version')" = "$version"
          test "$(node -p 'require("./marketplace.json").plugins[0].version')" = "$version"
          test "$(node -p 'require("./server.json").version')" = "$version"
          test "$(node -p 'require("./server.json").packages[0].version')" = "$version"
          test "$(node -p 'require("./package.json").mcpName')" = "$(node -p 'require("./server.json").name')"
      - name: Take the notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Build and verify the package
        run: |
          npm ci
          npm test
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "self-starter@$version" version --registry https://registry.npmjs.org > /dev/null 2>&1; then
            echo "self-starter@$version is already published on npm; skipping."
            exit 0
          fi
          node -e 'const [maj,min,pat]=process.argv[1].split(".").map(Number); process.exit(maj>11||(maj===11&&(min>5||(min===5&&pat>=1)))?0:1)' "$(npm --version)" || npm install -g npm@latest
          npm publish --provenance --access public --registry https://registry.npmjs.org
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Self-Starter $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "Self-Starter $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
      - name: Publish to the Official MCP Registry
        env:
          MCP_PUBLISHER_VERSION: 1.8.9
          MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
        run: |
          version="${GITHUB_REF_NAME#v}"
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.hyprh%2Fself-starter/versions/$version")"
          if [ "$status" = "200" ]; then
            echo "io.github.hyprh/self-starter@$version is already published on the MCP Registry; skipping."
            exit 0
          fi
          archive="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" validate server.json
          # Wait briefly for npm CDN propagation right after publish before MCP Registry verifies package.json.
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "https://registry.npmjs.org/self-starter/$version" | node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync(0,"utf8")); process.exit(p.mcpName==="io.github.hyprh/self-starter"?0:1)'; then
              break
            fi
            sleep 10
          done
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish server.json
