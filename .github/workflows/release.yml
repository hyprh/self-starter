# Publishes a GitHub release when a version tag is pushed, with its section of CHANGELOG.md.
# A release made on the website (which creates the tag) gets the same notes.
# The plugin's launcher installs the runtime from this tag (github:hyprh/self-starter#v<version>).
# During development, existing catalogs keep their published runtime version.
# Before tagging, update all three plugin manifests to match package.json.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag against the package and the plugin
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$version"
          test "$(node -p 'require("./plugin/.codex-plugin/plugin.json").version')" = "$version"
          test "$(node -p 'require("./cc-plugin/.claude-plugin/plugin.json").version')" = "$version"
          test "$(node -p 'require("./zcode-plugin/.zcode-plugin/plugin.json").version')" = "$version"
      - name: Take the notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Self-Starter $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "Self-Starter $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
