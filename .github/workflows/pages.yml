# Publishes site/ to GitHub Pages. One-time setup: Settings > Pages > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/demos/futu-notification.gif", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Include the shared notification demo
        run: |
          mkdir -p site/assets
          cp docs/demos/futu-notification.gif site/assets/futu-notification.gif
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
