# Sends real email and reads it back: the email channel is set up through the
# CLI and a trigger fires, all into a throwaway Ethereal mailbox (test/e2e/email.ts).
name: Email

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/engine/channels.ts"
      - "src/engine/mail-providers.ts"
      - "src/cli/settings.ts"
      - "test/e2e/email.ts"
      - "package-lock.json"
      - ".github/workflows/email.yml"
  pull_request:
    paths:
      - "src/engine/channels.ts"
      - "src/engine/mail-providers.ts"
      - "src/cli/settings.ts"
      - "test/e2e/email.ts"
      - "package-lock.json"
      - ".github/workflows/email.yml"

permissions:
  contents: read

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node dist/test/e2e/email.js
