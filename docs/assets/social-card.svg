<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Self-Starter — Ask once. Act when it happens.</title>
  <desc id="description">Local event triggers for Codex, Claude Code, ZCode and OpenCode. ZCode and OpenCode use source installations. No model calls during scheduled checks.</desc>
  <rect width="1200" height="630" fill="#f6f4ee"/>
  <g transform="translate(64 54)">
    <svg width="58" height="58" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="ss-card-bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#3a261c"/>
          <stop offset="100%" stop-color="#211713"/>
        </linearGradient>
      </defs>
      <rect width="512" height="512" rx="112" fill="url(#ss-card-bg)"/>
      <path d="M308 121.6A144 144 0 1 0 396 294.4" fill="none" stroke="#faf5ed" stroke-width="44" stroke-linecap="round"/>
      <circle cx="372" cy="156" r="68" fill="#f59e0b" fill-opacity="0.24"/>
      <circle cx="372" cy="156" r="46.4" fill="#fbbf24"/>
    </svg>
  </g>
  <g font-family="Noto Sans, sans-serif">
    <text x="140" y="94" font-size="30" font-weight="700" letter-spacing="-0.8" fill="#1d1b18">Self-Starter</text>
    <text x="1136" y="82" text-anchor="end" font-size="21" fill="#686259">Codex · Claude Code · ZCode · OpenCode</text>
    <text x="1136" y="111" text-anchor="end" font-size="16" fill="#686259">ZCode + OpenCode: source install</text>
    <text x="64" y="248" font-size="86" font-weight="700" letter-spacing="-3.3" fill="#1d1b18">Ask once.</text>
    <text x="64" y="347" font-size="78" font-weight="700" letter-spacing="-3.3" fill="#b45318">Act when it happens.</text>
    <text x="64" y="420" font-size="26" fill="#686259">Tell your agent what to watch and what to do next.</text>
    <text x="64" y="460" font-size="26" fill="#686259">Local code checks files, jobs, services and APIs.</text>
    <line x1="64" y1="540" x2="1136" y2="540" stroke="#e2ddd2"/>
    <circle cx="70" cy="582" r="5" fill="#e8870e"/>
    <text x="88" y="588" font-size="18" fill="#686259">No model calls during scheduled checks.</text>
    <text x="1136" y="588" text-anchor="end" font-size="18" fill="#686259">hyprh.github.io/self-starter</text>
  </g>
</svg>
